services:
  dashboard:
    build: ${DEFAULT_APPS_MOUNT}/home-server-dashboard
    container_name: home_lab_dashboard
    ports:
      - "${DASHBOARD_PORT}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=${DEFAULT_PUID}
      - PGID=${DEFAULT_GUID}
      - TZ=${DEFAULT_TIMEZONE}
      - VERSION=docker
      - ENABLE_HW_TRANSCODE=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - ${DEFAULT_APPS_MOUNT}/${PLEX_FOLDER}/config:/config
      - ${DEFAULT_STORAGE_MOUNT}/${PLEX_FOLDER}/transcode:/transcode
      - ${DEFAULT_STORAGE_MOUNT}/${QBITTORRENT_FOLDER}/${QBITTORRENT_DOWNLOADS_FOLDER}:/data
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:32400/identity >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: always

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${DEFAULT_PUID}
      - PGID=${DEFAULT_GUID}
      - TZ=${DEFAULT_TIMEZONE}
      - WEBUI_PORT=${QBITTORRENT_UI_PORT}
      - TORRENTING_PORT=${QBITTORRENT_TORRENTING_PORT}
    volumes:
      - ${DEFAULT_APPS_MOUNT}/${QBITTORRENT_FOLDER}/config:/config
      - ${DEFAULT_STORAGE_MOUNT}/${QBITTORRENT_FOLDER}/${QBITTORRENT_DOWNLOADS_FOLDER}:/${QBITTORRENT_DOWNLOADS_FOLDER}
    ports:
      - "${QBITTORRENT_UI_PORT}:${QBITTORRENT_UI_PORT}"
      - "${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}"
      - "${QBITTORRENT_TORRENTING_PORT}:${QBITTORRENT_TORRENTING_PORT}/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:$${WEBUI_PORT:-8080}/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: filebrowser
    ports:
      - "${FILEBROWSER_UI_PORT}:80"
    volumes:
      - ${DEFAULT_APPS_MOUNT}/${FILEBROWSER_FOLDER}/config:/config
      - ${DEFAULT_STORAGE_MOUNT}/:/srv
    environment:
      - PUID=${DEFAULT_PUID}
      - PGID=${DEFAULT_GUID}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always

  samba:
    image: dockurr/samba:4.22.6
    container_name: samba
    environment:
      NAME: "${SAMBA_SHARE_NAME}"
      USER: "${SAMBA_USERNAME}"
      PASS: "${SAMBA_PASSWORD}"
      PUID: "${DEFAULT_PUID}"
      PGID: "${DEFAULT_GUID}"
    ports:
      - "${SAMBA_PORT}:445"
    volumes:
      - ${DEFAULT_STORAGE_MOUNT}:/storage
    healthcheck:
      test: ["CMD-SHELL", "smbclient --configfile=/etc/samba.conf -L //127.0.0.1 -U % -m SMB3 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${DEFAULT_PUID}
      - PGID=${DEFAULT_GUID}
      - TZ=${DEFAULT_TIMEZONE}
    volumes:
      - ${DEFAULT_APPS_MOUNT}/${SONARR_FOLDER}/config:/config
      - ${DEFAULT_STORAGE_MOUNT}/${QBITTORRENT_FOLDER}/${QBITTORRENT_DOWNLOADS_FOLDER}/${QBITTORRENT_TV_FOLDER}:/${SONARR_TV_FOLDER}
      - ${DEFAULT_STORAGE_MOUNT}/${QBITTORRENT_FOLDER}/${QBITTORRENT_DOWNLOADS_FOLDER}/${QBITTORRENT_MOVIES_FOLDER}:/${SONARR_MOVIES_FOLDER}
      - ${DEFAULT_STORAGE_MOUNT}/${QBITTORRENT_FOLDER}/${QBITTORRENT_DOWNLOADS_FOLDER}/:/downloads
    ports:
      - "${SONARR_PORT}:8989"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8989/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${DEFAULT_PUID}
      - PGID=${DEFAULT_GUID}
      - TZ=${DEFAULT_TIMEZONE}
    volumes:
      - ${DEFAULT_APPS_MOUNT}/${RADARR_FOLDER}/config:/config
      - ${DEFAULT_STORAGE_MOUNT}/${QBITTORRENT_FOLDER}/${QBITTORRENT_DOWNLOADS_FOLDER}/${QBITTORRENT_TV_FOLDER}:/${RADARR_TV_FOLDER}
      - ${DEFAULT_STORAGE_MOUNT}/${QBITTORRENT_FOLDER}/${QBITTORRENT_DOWNLOADS_FOLDER}/${QBITTORRENT_MOVIES_FOLDER}:/${RADARR_MOVIES_FOLDER}
      - ${DEFAULT_STORAGE_MOUNT}/${QBITTORRENT_FOLDER}/${QBITTORRENT_DOWNLOADS_FOLDER}/:/downloads
    ports:
      - "${RADARR_PORT}:7878"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:7878/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=${DEFAULT_PUID}
      - PGID=${DEFAULT_GUID}
      - TZ=${DEFAULT_TIMEZONE}
    volumes:
      - ${DEFAULT_APPS_MOUNT}/${JACKETT_FOLDER}/config:/config
      - ${DEFAULT_STORAGE_MOUNT}/${QBITTORRENT_FOLDER}/${QBITTORRENT_DOWNLOADS_FOLDER}/${QBITTORRENT_TV_FOLDER}:/${JACKETT_TV_FOLDER}
      - ${DEFAULT_STORAGE_MOUNT}/${QBITTORRENT_FOLDER}/${QBITTORRENT_DOWNLOADS_FOLDER}/${QBITTORRENT_MOVIES_FOLDER}:/${JACKETT_MOVIES_FOLDER}
      - ${DEFAULT_STORAGE_MOUNT}/${QBITTORRENT_FOLDER}/${QBITTORRENT_DOWNLOADS_FOLDER}/:/downloads
    ports:
      - "${JACKETT_PORT}:9117"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9117/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    user: "${DEFAULT_PUID}:${DEFAULT_GUID}"
    volumes:
      - type: bind
        source: ${DEFAULT_STORAGE_MOUNT}/${MAINTAINERR_FOLDER}/data
        target: /opt/data
    environment:
      - TZ=${DEFAULT_TIMEZONE}
    ports:
      - "${MAINTAINERR_PORT}:6246"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6246/api/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: always

  couchdb:
    image: couchdb:3.5
    container_name: couchdb-for-ols
    user: "${DEFAULT_PUID}:${DEFAULT_GUID}"
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - ${DEFAULT_APPS_MOUNT}/${COUCHDB_FOLDER}/couchdb-data:/opt/couchdb/data
      - ${DEFAULT_APPS_MOUNT}/${COUCHDB_FOLDER}/couchdb-etc:/opt/couchdb/etc/local.d
    ports:
      - "${COUCHDB_PORT}:5984"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5984/_up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    cap_add:
      - NET_ADMIN
    environment:
      TZ: '${DEFAULT_TIMEZONE}'
      PIHOLE_UID: '${DEFAULT_PUID}'
      PIHOLE_GID: '${DEFAULT_GUID}'
      WEBPASSWORD: '${PI_HOLE_WEB_PASSWORD}'
      FTLCONF_webserver_api_password: '${PI_HOLE_WEB_PASSWORD}'
      DNSMASQ_LISTENING: 'all'
    dns:
      - 127.0.0.1
      - ${PI_HOLE_DEFAULT_DNS}
    volumes:
      - ${DEFAULT_APPS_MOUNT}/${PI_HOLE_FOLDER}/${PI_HOLE_FOLDER}/:/etc/pihole
      - ${DEFAULT_APPS_MOUNT}/${PI_HOLE_FOLDER}/${PI_HOLE_DNSMASQ_FOLDER}:/etc/dnsmasq.d
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${PI_HOLE_UI_PORT}:80/tcp"
    healthcheck:
      test: ["CMD-SHELL", "dig +short +norecurse +retry=0 @127.0.0.1 pi.hole >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=${SEERR_LOG_LEVEL:-info}
      - TZ=${DEFAULT_TIMEZONE}
    ports:
      - "${SEERR_PORT}:5055"
    volumes:
      - ${DEFAULT_APPS_MOUNT}/${SEERR_FOLDER}/config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${DEFAULT_TIMEZONE}
    ports:
      - "${FLARESOLVERR_PORT}:8191"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8191/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ${DEFAULT_APPS_MOUNT}/${OLLAMA_FOLDER}:/root/.ollama
    environment:
      - PUID=${DEFAULT_PUID}
      - PGID=${DEFAULT_GUID}
      - TZ=${DEFAULT_TIMEZONE}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:v0.34.0
    container_name: vllm
    profiles: ["vllm"]
    user: "${DEFAULT_PUID}:0"
    ports:
      - "${VLLM_BIND_IP}:${VLLM_PORT}:8000"
    volumes:
      - ${DEFAULT_APPS_MOUNT}/${VLLM_FOLDER}:/home/vllm/.cache
    environment:
      - HOME=/home/vllm
      - HF_HOME=/home/vllm/.cache/huggingface
      - VLLM_CACHE_ROOT=/home/vllm/.cache/vllm
      - HF_XET_HIGH_PERFORMANCE=1
      - VLLM_NO_USAGE_STATS=1
      - DO_NOT_TRACK=1
      - VLLM_API_KEY=${VLLM_API_KEY}
      - HF_TOKEN=${VLLM_HF_TOKEN}
      - VLLM_MODEL=${VLLM_MODEL}
      - VLLM_SERVED_MODEL_NAME=${VLLM_SERVED_MODEL_NAME}
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION}
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN}
      - VLLM_MAX_NUM_SEQS=${VLLM_MAX_NUM_SEQS}
      - VLLM_TOOL_CALL_PARSER=${VLLM_TOOL_CALL_PARSER}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        case "$${HF_TOKEN:-}" in ""|CHANGE_TO_*) unset HF_TOKEN ;; esac;
        case "$${VLLM_API_KEY:-}" in ""|CHANGE_TO_*)
        echo "Error: VLLM_API_KEY must be set to a real token in .env (not a CHANGE_TO_* placeholder)." >&2;
        exit 1 ;;
        esac;
        exec vllm serve "$$VLLM_MODEL"
        --host 0.0.0.0
        --port 8000
        --served-model-name "$$VLLM_SERVED_MODEL_NAME"
        --gpu-memory-utilization "$$VLLM_GPU_MEMORY_UTILIZATION"
        --max-model-len "$$VLLM_MAX_MODEL_LEN"
        --max-num-seqs "$$VLLM_MAX_NUM_SEQS"
        --enable-auto-tool-choice
        --tool-call-parser "$$VLLM_TOOL_CALL_PARSER"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    profiles:
      - beta
    command: ["gateway", "run"]
    depends_on:
      - ollama
    ports:
      - "${HERMES_DASHBOARD_BIND_IP}:${HERMES_DASHBOARD_PORT}:9119"
    volumes:
      - ${DEFAULT_APPS_MOUNT}/${HERMES_FOLDER}:/opt/data
    environment:
      - HERMES_UID=${DEFAULT_PUID}
      - HERMES_GID=${DEFAULT_GUID}
      - TZ=${DEFAULT_TIMEZONE}
      - HERMES_TIMEZONE=${DEFAULT_TIMEZONE}
      - HERMES_API_TIMEOUT=${HERMES_API_TIMEOUT}
      - HERMES_DASHBOARD=${HERMES_DASHBOARD}
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
      - API_SERVER_ENABLED=false
      - HERMES_INFERENCE_PROVIDER=${HERMES_INFERENCE_PROVIDER:-}
      - OPENROUTER_API_KEY=${HERMES_OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${HERMES_OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${HERMES_OPENAI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${HERMES_ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${HERMES_GEMINI_API_KEY:-}
      - XAI_API_KEY=${HERMES_XAI_API_KEY:-}
      - GROQ_API_KEY=${HERMES_GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${HERMES_DEEPSEEK_API_KEY:-}
      - MISTRAL_API_KEY=${HERMES_MISTRAL_API_KEY:-}
      - NVIDIA_API_KEY=${HERMES_NVIDIA_API_KEY:-}
      - HF_TOKEN=${HERMES_HF_TOKEN:-}
      - OLLAMA_API_KEY=${HERMES_OLLAMA_API_KEY:-}
    shm_size: "1g"
    mem_limit: 4g
    pids_limit: 512
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$${HERMES_DASHBOARD:-1}" = "1" ]; then
            python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/api/status', timeout=5)";
          else
            test -S /opt/data/gateway.sock;
          fi
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  qdirstat:
    image: jlesage/qdirstat
    container_name: qdirstat
    ports:
      - "${QDirstat_PORT}:5800"
    volumes:
      - ${DEFAULT_APPS_MOUNT}/${QDirstat_FOLDER}/config:/config
      - ${DEFAULT_STORAGE_MOUNT}:/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5800/site.webmanifest"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
