# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
header_marker = "<!-- git-cliff: end of header -->"
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | trim | upper_first }} \
            ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/Razbuzz/HomeLab/commit/{{ commit.id }}))\
            {% if commit.breaking_description and commit.breaking_description != commit.message %} — **BREAKING CHANGE:** {{ commit.breaking_description | replace(from="\n", to=" ") | trim }}{% endif -%}
    {% endfor %}
{% endfor %}\n
"""
footer = """
---
*Generated by [git-cliff](https://git-cliff.org).*
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
tag_pattern = "v[0-9].*"
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^doc", group = "<!-- 2 -->Documentation" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^ci", group = "<!-- 5 -->CI/CD" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^Merge pull request", skip = true },
  { message = "^Merge branch", skip = true },
  { message = "^(build|chore|style)", group = "<!-- 7 -->Miscellaneous" },
  { message = ".*", group = "<!-- 8 -->Other Changes" },
]
filter_commits = false
fail_on_unmatched_commit = false
topo_order = false
sort_commits = "newest"
recurse_submodules = false
